<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18221c" />
      <stop offset="100%" stop-color="#0a0d0b" />
    </radialGradient>
    <linearGradient id="pastelGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#243329" stroke-width="6" />
  
  <!-- Subtle decorative circular ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#223629" stroke-width="2" stroke-dasharray="6 8" />

  <!-- Tagpuan Emblem: Burger Bun Top (Arch) -->
  <path d="M166 210 C 166 145, 346 145, 346 210 Z" fill="url(#pastelGreenGrad)" />

  <!-- Sesame/Accent dots -->
  <ellipse cx="230" cy="180" rx="6" ry="3" fill="#0d1f14" opacity="0.75" />
  <ellipse cx="270" cy="175" rx="6" ry="3" fill="#0d1f14" opacity="0.75" />
  <ellipse cx="295" cy="190" rx="5" ry="3" fill="#0d1f14" opacity="0.75" />
  <ellipse cx="205" cy="192" rx="5" ry="3" fill="#0d1f14" opacity="0.75" />

  <!-- Tagpuan Siomai / Savory Layer (Ruffled pleated patty) -->
  <rect x="156" y="222" width="200" height="24" rx="8" fill="#ffffff" />
  <path d="M166 234 Q 186 244 206 234 T 246 234 T 286 234 T 326 234 T 346 234" fill="none" stroke="#86efac" stroke-width="4" stroke-linecap="round" />

  <!-- Siomai steam crest (Golden-accent/pastel garnish) -->
  <circle cx="256" cy="218" r="6" fill="#4ade80" />

  <!-- Burger Bottom Bun -->
  <rect x="166" y="258" width="180" height="32" rx="14" fill="url(#pastelGreenGrad)" />

  <!-- Typography: TAGPUAN -->
  <text x="256" y="340" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">TAGPUAN</text>
  
  <!-- Subtitle: ERP -->
  <rect x="216" y="360" width="80" height="26" rx="6" fill="#1b2e22" stroke="#86efac" stroke-width="1.5" />
  <text x="256" y="378" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#86efac" text-anchor="middle" letter-spacing="3">ERP</text>
</svg>
